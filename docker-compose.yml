services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  ingestao:
    build:
      context: .
      dockerfile: servicos/ingestao/Dockerfile
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379/0
      INDICE_PATH: /dados/indice.json
    volumes:
      - dados:/dados
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: servicos/ingestao/Dockerfile
    command: ["python", "-m", "servicos.ingestao.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      INDICE_PATH: /dados/indice.json
    volumes:
      - dados:/dados
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  recuperacao:
    build:
      context: .
      dockerfile: servicos/recuperacao/Dockerfile
    ports:
      - "8002:8002"
    environment:
      URL_INGESTAO: http://ingestao:8001
    depends_on:
      - ingestao

  geracao:
    build:
      context: .
      dockerfile: servicos/geracao/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - path: .env
        required: false
    environment:
      URL_RECUPERACAO: http://recuperacao:8002
    depends_on:
      - recuperacao

volumes:
  dados:
